name: Repository validation

on:
  pull_request:
    paths:
      - ".github/workflows/catalog-validation.yml"
      - "CHANGELOG.md"
      - "VERSION.md"
      - "ROADMAP.md"
      - "project/**"
      - "docs/superpowers/reviews/**"
      - "architectures/**"
      - "assessment/**"
      - "controls/**"
      - "crosswalks/**"
      - "tests/**"
      - "tools/crosswalks/**"
      - "tools/release_gates.py"
      - "tools/mermaid_inventory.py"
      - "tools/validate_links.py"
      - "tools/validate_architectures.py"
      - "tools/validate_assessment.py"
      - "tools/validate_controls.py"
      - "tools/validate_crosswalks.py"
      - "requirements-dev.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-validation.yml"
      - "CHANGELOG.md"
      - "VERSION.md"
      - "ROADMAP.md"
      - "project/**"
      - "docs/superpowers/reviews/**"
      - "architectures/**"
      - "assessment/**"
      - "controls/**"
      - "crosswalks/**"
      - "tests/**"
      - "tools/crosswalks/**"
      - "tools/release_gates.py"
      - "tools/mermaid_inventory.py"
      - "tools/validate_links.py"
      - "tools/validate_architectures.py"
      - "tools/validate_assessment.py"
      - "tools/validate_controls.py"
      - "tools/validate_crosswalks.py"
      - "requirements-dev.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ESAF sources
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run repository unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate assessment foundation
        run: python tools/validate_assessment.py --check
      - name: Validate architecture foundation
        run: python tools/validate_architectures.py
      - name: Validate controls and generated catalog
        run: python tools/validate_controls.py --check
      - name: Validate crosswalk catalog
        run: python tools/validate_crosswalks.py --check
      - name: Validate crosswalk history on pull request
        if: github.event_name == 'pull_request'
        run: python tools/validate_crosswalks.py --check --baseline-ref "${{ github.event.pull_request.base.sha }}"
      - name: Validate crosswalk history on protected-branch push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python tools/validate_crosswalks.py --check --baseline-ref "${{ github.event.before }}"
      - name: Validate release gate record on pull request
        if: github.event_name == 'pull_request'
        run: python tools/release_gates.py --check --baseline-ref "${{ github.event.pull_request.base.sha }}"
      - name: Validate release gate record on protected-branch push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python tools/release_gates.py --check --baseline-ref "${{ github.event.before }}"
      - name: Validate release gate record on workflow dispatch
        if: github.event_name == 'workflow_dispatch'
        run: python tools/release_gates.py --check --baseline-ref "HEAD^"
      - name: Validate repository-local links
        run: python tools/validate_links.py --check
