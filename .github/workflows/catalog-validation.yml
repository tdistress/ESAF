name: Repository validation

on:
  pull_request:
    paths:
      - ".github/workflows/catalog-validation.yml"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "LICENSES/**"
      - "LICENSE_SCOPE.md"
      - "NOTICE"
      - "README.md"
      - "THIRD_PARTY_NOTICES.md"
      - "TRADEMARKS.md"
      - "VERSION.md"
      - "ROADMAP.md"
      - "project/**"
      - "docs/superpowers/reviews/**"
      - "docs/superpowers/specs/**"
      - "architectures/**"
      - "assessment/**"
      - "controls/**"
      - "crosswalks/**"
      - "profiles/**"
      - "tests/**"
      - "tools/crosswalks/**"
      - "tools/build_mapping_review_bundle.py"
      - "tools/validate_qualified_review_evidence.py"
      - "tools/seal_qualified_review_campaign.py"
      - "tools/crosswalks/qualified_review_evidence.py"
      - "tools/test-shards.json"
      - "tools/test_shards.py"
      - "tools/validate_test_shards.py"
      - "tools/run_test_shards.py"
      - "tools/plan_validation.py"
      - "tools/release_gates.py"
      - "tools/v05_beta_release_gates.py"
      - "tools/v05_beta_release_evidence.py"
      - "tests/test_v05_beta_release_gates.py"
      - "tests/test_v05_beta_release_evidence.py"
      - "docs/superpowers/reviews/2026-07-27-v05-beta-publication-readiness.md"
      - "docs/superpowers/reviews/2026-07-27-v05-beta-mermaid-rendering.md"
      - "tools/mermaid-render-config.json"
      - "tools/mermaid-puppeteer-ci.json"
      - "tools/mermaid_inventory.py"
      - "tools/validate_links.py"
      - "tools/validate_architectures.py"
      - "tools/validate_assessment.py"
      - "tools/validate_controls.py"
      - "tools/validate_crosswalks.py"
      - "tools/validate_profiles.py"
      - "tools/render_pci_dss_mapping_go_no_go.py"
      - "tools/render_nist_ai_rmf_mapping_go_no_go.py"
      - "requirements-dev.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-validation.yml"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "LICENSES/**"
      - "LICENSE_SCOPE.md"
      - "NOTICE"
      - "README.md"
      - "THIRD_PARTY_NOTICES.md"
      - "TRADEMARKS.md"
      - "VERSION.md"
      - "ROADMAP.md"
      - "project/**"
      - "docs/superpowers/reviews/**"
      - "docs/superpowers/specs/**"
      - "architectures/**"
      - "assessment/**"
      - "controls/**"
      - "crosswalks/**"
      - "profiles/**"
      - "tests/**"
      - "tools/crosswalks/**"
      - "tools/build_mapping_review_bundle.py"
      - "tools/validate_qualified_review_evidence.py"
      - "tools/seal_qualified_review_campaign.py"
      - "tools/crosswalks/qualified_review_evidence.py"
      - "tools/test-shards.json"
      - "tools/test_shards.py"
      - "tools/validate_test_shards.py"
      - "tools/run_test_shards.py"
      - "tools/plan_validation.py"
      - "tools/release_gates.py"
      - "tools/v05_beta_release_gates.py"
      - "tools/v05_beta_release_evidence.py"
      - "tests/test_v05_beta_release_gates.py"
      - "tests/test_v05_beta_release_evidence.py"
      - "docs/superpowers/reviews/2026-07-27-v05-beta-publication-readiness.md"
      - "docs/superpowers/reviews/2026-07-27-v05-beta-mermaid-rendering.md"
      - "tools/mermaid-render-config.json"
      - "tools/mermaid-puppeteer-ci.json"
      - "tools/mermaid_inventory.py"
      - "tools/validate_links.py"
      - "tools/validate_architectures.py"
      - "tools/validate_assessment.py"
      - "tools/validate_controls.py"
      - "tools/validate_crosswalks.py"
      - "tools/validate_profiles.py"
      - "tools/render_pci_dss_mapping_go_no_go.py"
      - "tools/render_nist_ai_rmf_mapping_go_no_go.py"
      - "requirements-dev.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    name: Unit tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        shard:
          - profile_validation
          - qualified_review_evidence
          - mapping_review_bundle
          - remaining
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run unit test shard
        run: python tools/run_test_shards.py --shard "${{ matrix.shard }}" --durations 50

  validation_gates:
    name: Operational validation gates
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Set up Node for Mermaid rendering
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          package-manager-cache: false
      - name: Install pinned Mermaid renderer
        run: npm install --global @mermaid-js/mermaid-cli@11.16.0
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Validate unit test shard manifest
        run: python tools/validate_test_shards.py --check
      - name: Validate assessment foundation
        run: python tools/validate_assessment.py --check
      - name: Validate profiles
        run: python tools/validate_profiles.py --check
      - name: Validate architecture foundation
        run: python tools/validate_architectures.py
      - name: Validate controls and generated catalog
        run: python tools/validate_controls.py --check
      - name: Validate crosswalk catalog
        run: python tools/validate_crosswalks.py --check
      - name: Validate PCI DSS readiness review
        run: python tools/render_pci_dss_mapping_go_no_go.py --check
      - name: Validate NIST AI RMF readiness review
        run: python tools/render_nist_ai_rmf_mapping_go_no_go.py --check
      - name: Validate crosswalk history on pull request
        if: github.event_name == 'pull_request'
        run: python tools/validate_crosswalks.py --check --baseline-ref "${{ github.event.pull_request.base.sha }}"
      - name: Validate crosswalk history on protected-branch push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python tools/validate_crosswalks.py --check --baseline-ref "${{ github.event.before }}"
      - name: Validate historical release record on pull request
        if: github.event_name == 'pull_request'
        run: python tools/release_gates.py --check --baseline-ref "${{ github.event.pull_request.base.sha }}"
      - name: Validate historical release record on protected-branch push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python tools/release_gates.py --check --baseline-ref "${{ github.event.before }}"
      - name: Validate historical release record on workflow dispatch
        if: github.event_name == 'workflow_dispatch'
        run: python tools/release_gates.py --check --baseline-ref "HEAD^"
      - name: Validate v0.5-beta release record on pull request
        if: github.event_name == 'pull_request'
        run: python tools/v05_beta_release_gates.py --check --baseline-ref "${{ github.event.pull_request.base.sha }}"
      - name: Validate v0.5-beta release record on protected-branch push
        if: github.event_name == 'push'
        run: python tools/v05_beta_release_gates.py --check --baseline-ref "${{ github.event.before }}"
      - name: Validate v0.5-beta release record on workflow dispatch
        if: github.event_name == 'workflow_dispatch'
        run: python tools/v05_beta_release_gates.py --check --baseline-ref "HEAD^"
      - name: Render and validate the v0.5-beta Mermaid baseline
        env:
          ESAF_MERMAID_PUPPETEER_CONFIG: tools/mermaid-puppeteer-ci.json
        run: python tools/mermaid_inventory.py --check-record docs/superpowers/reviews/2026-07-27-v05-beta-mermaid-rendering.md
      - name: Validate repository-local links
        run: python tools/validate_links.py --check

  validate:
    name: Validate ESAF sources
    if: ${{ always() }}
    needs:
      - unit_tests
      - validation_gates
    runs-on: ubuntu-latest
    env:
      UNIT_TESTS_RESULT: ${{ needs.unit_tests.result }}
      VALIDATION_GATES_RESULT: ${{ needs.validation_gates.result }}
    steps:
      - name: Require all validation jobs to pass
        run: |
          if [ "$UNIT_TESTS_RESULT" != "success" ] || [ "$VALIDATION_GATES_RESULT" != "success" ]; then
            exit 1
          fi
