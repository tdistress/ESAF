name: Repository validation

on:
  pull_request:
    paths:
      - ".github/workflows/catalog-validation.yml"
      - "architectures/**"
      - "controls/**"
      - "tests/**"
      - "tools/validate_architectures.py"
      - "tools/validate_controls.py"
      - "requirements-dev.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-validation.yml"
      - "architectures/**"
      - "controls/**"
      - "tests/**"
      - "tools/validate_architectures.py"
      - "tools/validate_controls.py"
      - "requirements-dev.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ESAF sources
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run repository unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate architecture foundation
        run: python tools/validate_architectures.py
      - name: Validate controls and generated catalog
        run: python tools/validate_controls.py --check
